# Job notturno: i feedback lasciati da Lorenzo nell'app (tabella `feedback`,
# stato `nuovo`) diventano issue `dal-lorenzo` con una parafrasi senza dati
# personali, e il feedback passa a `preso-in-carico` con il numero della
# issue. I feedback `riaperto` (Lorenzo ha detto "non è sistemato") riaprono
# la loro issue con l'etichetta `riaperto` (`ostinato` dalla seconda volta),
# e le note/risposte di Lorenzo finiscono nella issue, parafrasate.
# Vedi CLAUDE.md > "Feedback".
#
# Il repo è PUBBLICO: log e issue sono visibili a chiunque. Per questo:
# - Claude gira senza token GitHub, senza secret del sito e senza Bash o
#   rete (solo Read/Glob/Grep/Write), e il suo output non va nei log;
# - le issue le crea lo script, dopo un controllo privacy deterministico
#   (.github/scripts/privacy.mjs); se la parafrasi non passa, pubblica un
#   corpo generico che rimanda a Supabase.
#
# Secret: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token), RADAR_URL,
# FEEDBACK_AGENTE_SECRET (o l'alias FEEDBACK_AGENT_SECRET).
# Avvio manuale: Actions > radar-feedback-notte >
# Run workflow.
name: radar-feedback-notte

on:
  schedule:
    # 01:23 UTC ≈ 03:23 in Italia (ora legale). Minuto non tondo: i cron
    # di GitHub all'ora esatta partono spesso in ritardo.
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: radar-feedback-notte
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  feedback-in-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scarica feedback nuovi, riaperti e note
        id: scarica
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          FEEDBACK_AGENTE_SECRET: ${{ secrets.FEEDBACK_AGENTE_SECRET || secrets.FEEDBACK_AGENT_SECRET }}
        run: node .github/scripts/feedback-notte.mjs scarica

      # Solo se c'è qualcosa da parafrasare: niente quota Claude nelle notti
      # vuote (i soli riaperti senza note non ne hanno bisogno).
      - name: Claude scrive titoli e parafrasi
        if: steps.scarica.outputs.da_parafrasare != '0'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # L'output di Claude contiene ragionamenti sul testo privato: finisce
        # in un file che non viene mai stampato né caricato, e nel log va solo
        # la categoria dell'errore (.github/scripts/diagnosi-claude.mjs).
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN mancante: le issue avranno il corpo generico."
          elif ! npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || ! command -v claude >/dev/null; then
            echo "::warning::Installazione di Claude Code fallita: le issue avranno il corpo generico."
          else
            set +e
            claude -p "$(cat .github/scripts/prompt-feedback-notte.md)" \
              --allowedTools "Read,Glob,Grep,Write" \
              --disallowedTools "Bash,WebFetch,WebSearch" \
              --max-turns 40 > "$RUNNER_TEMP/claude.log" 2>&1
            esito=$?
            set -e
            if [ "$esito" -eq 0 ]; then
              echo "Claude ha terminato."
            else
              echo "::warning::Claude non ha terminato ($(node .github/scripts/diagnosi-claude.mjs "$RUNNER_TEMP/claude.log" "$esito")): le issue avranno il corpo generico."
            fi
            rm -f "$RUNNER_TEMP/claude.log"
          fi
          test -f .radar-tmp/proposte.json && echo "proposte.json presente." || echo "proposte.json assente."

      - name: Crea/riapre le issue, riporta le note e aggiorna lo stato
        if: steps.scarica.outputs.quanti != '0'
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          FEEDBACK_AGENTE_SECRET: ${{ secrets.FEEDBACK_AGENTE_SECRET || secrets.FEEDBACK_AGENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/feedback-notte.mjs pubblica
