# Quando una PR che chiude una issue `dal-lorenzo` viene mergiata, il
# feedback da cui è nata passa a `risolto` con il numero della PR
# (POTENZIAMENTO 1, vedi CLAUDE.md > "Feedback"). Passa dall'endpoint
# /api/feedback/agente: la service role key resta su Vercel.
#
# Secret richiesti (Settings > Secrets and variables > Actions):
#   RADAR_URL               es. https://tuo-dominio.it (senza / finale)
#   FEEDBACK_AGENTE_SECRET  stesso valore della env var su Vercel
# Se mancano, il job termina senza errori con un avviso.
name: feedback-risolto

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  aggiorna-stato:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          FEEDBACK_AGENTE_SECRET: ${{ secrets.FEEDBACK_AGENTE_SECRET }}
        with:
          script: |
            const { RADAR_URL, FEEDBACK_AGENTE_SECRET } = process.env;
            if (!RADAR_URL || !FEEDBACK_AGENTE_SECRET) {
              core.notice("RADAR_URL o FEEDBACK_AGENTE_SECRET mancanti: stato dei feedback non aggiornato.");
              return;
            }
            const pr = context.payload.pull_request.number;
            // closingIssuesReferences copre sia "Closes #N" nel corpo sia
            // le issue collegate a mano dalla sidebar della PR.
            const risposta = await github.graphql(
              `query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 20) {
                      nodes { number labels(first: 20) { nodes { name } } }
                    }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, pr }
            );
            const issue = risposta.repository.pullRequest.closingIssuesReferences.nodes
              .filter((i) => i.labels.nodes.some((l) => l.name === "dal-lorenzo"));
            for (const { number } of issue) {
              const res = await fetch(`${RADAR_URL}/api/feedback/agente`, {
                method: "PATCH",
                headers: { Authorization: `Bearer ${FEEDBACK_AGENTE_SECRET}`, "Content-Type": "application/json" },
                body: JSON.stringify({ issue_number: number, stato: "risolto", pr_number: pr }),
              });
              if (!res.ok) {
                core.setFailed(`Issue #${number}: ${res.status} ${await res.text()}`);
              } else {
                core.info(`Issue #${number}: ${JSON.stringify(await res.json())}`);
              }
            }
