# Aggiornamenti automatici delle dipendenze: solo minor e patch, raggruppati in una PR a settimana
# (le major restano una scelta manuale). Gratis sul repo pubblico.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    labels:
      - dipendenze
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minori-e-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dipendenze
    groups:
      azioni:
        update-types: ["minor", "patch"]
